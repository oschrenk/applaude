version: '3'
dotenv: ['VERSION']
vars:
  APP_NAME: "applaude"
  RELEASE_DIR: "./.release"
  BUILD_TARGET: "./{{.APP_NAME}}"
tasks:
  run:
    cmds:
      - go run main.go
    silent: true
  check:
    cmds:
      - staticcheck ./...
  tidy:
    cmds:
      - go mod tidy
  lint:
    deps: [check, tidy]
  build:
    requires:
      vars: [BUILD_TARGET]
    cmds:
      - go build -v -o "{{.BUILD_TARGET}}"
    silent: true
  test:
    cmds:
      - go test ./...
    silent: true
  install:
    cmds:
      - |
        target="${GOBIN:-$HOME/Frameworks/go/bin}"
        if [ ! -d "$target" ]; then
          echo "task install: target directory does not exist: $target" >&2
          exit 1
        fi
        GOBIN="$target" go install
        echo "installed {{.APP_NAME}} -> $target"
    silent: true
  uninstall:
    cmds:
      - rm -f ${GOBIN}/{{.APP_NAME}}
    silent: true
  artifacts:
    requires:
      vars: [APP_NAME, RELEASE_DIR]
    cmds:
      - mkdir -p {{.RELEASE_DIR}}
      - CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w" -v -o {{.RELEASE_DIR}}/{{.APP_NAME}}-darwin-arm64
      - CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w" -v -o {{.RELEASE_DIR}}/{{.APP_NAME}}-darwin-amd64
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w" -v -o {{.RELEASE_DIR}}/{{.APP_NAME}}-linux-arm64
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -v -o {{.RELEASE_DIR}}/{{.APP_NAME}}-linux-amd64
    deps: [tidy]
  tag:
    deps: [artifacts]
    cmds:
      - git tag "$APP_VERSION"
      - git push origin "$APP_VERSION"
  sha:
    silent: true
    requires:
      vars: [APP_NAME, RELEASE_DIR]
    cmds:
      - |
        cd {{.RELEASE_DIR}}
        for f in $(find . -maxdepth 1 -type f -name "{{.APP_NAME}}-*" ! -name "*.sha256"); do
          sha256sum "$f" | tee "$f.sha256"
        done
  release:
    requires:
      vars: [APP_NAME, RELEASE_DIR]
    deps: [tag, sha]
    cmds:
      - gh release create --generate-notes "$APP_VERSION" {{.RELEASE_DIR}}/{{.APP_NAME}}-*
  clean:
    requires:
      vars: [BUILD_TARGET, RELEASE_DIR]
    cmds:
      - rm -rf {{.BUILD_TARGET}}
      - rm -rf {{.RELEASE_DIR}}
  updates:
    # {{` `}} is to escape go templating from go task
    cmds:
      - "go list -u -f '{{`{{if (and (not (or .Main .Indirect)) .Update)}}{{.Path}}: {{.Version}} -> {{.Update.Version}}{{end}}`}}' -m all 2> /dev/null"
